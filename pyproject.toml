[project]
name = "vnr"
version = "0.1.0"
description = "Voice-Native Web Research Agent — local streaming ASR + lightweight Nebius/Tavily research loop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
# Apple Silicon only — microphone capture for the ASR spike.
asr = [
    "sounddevice>=0.4.7",
    "numpy>=1.26",
]
# Local loopback service the Swift UI talks to (Milestone 3+).
service = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "websockets>=12.0",
    "prompt_toolkit>=3.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "numpy>=1.26",
]
# Apple Silicon only: Kyutai's MLX speech stack, run in-process (docs/milestone-1-asr.md).
mlx = [
    "moshi_mlx>=0.2.12",
    "rustymimi",
    "sentencepiece",
    "numpy>=1.26",
    "huggingface_hub>=0.24",
]

[project.scripts]
vnr-research = "vnr.cli.research_cli:main"
vnr-asr-spike = "vnr.cli.asr_spike:main"
vnr-service = "vnr.service:main"
vnr-prototype = "vnr.cli.prototype:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vnr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:vnr.*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
